# Should a random MOTD be selected from the list?
# true: Randomly selects from the list.
# false: Shows the first MOTD in the list.
random: false

player-count:
  # Enable player count modification feature.
  enabled: true

  # Show max players as (current players + 1).
  # Example: If 10 players online, shows as 11/11.
  just-one-more: true

  # Real player limit for the server (Slots).
  max-players: 100

  # Hides player list when hovering over player count.
  # ProtocolLib is required for this feature.
  disable-player-list-hover: true

# MOTD list to be shown in server list.
# Hex color codes (#123456) and gradients are supported.
motds:
  - line1: "<gradient:#7A63E7:#988ADB>           ✦ WidCore ▸ Essentials Alternative ✦</gradient>"
    line2: "<gradient:#7A63E7:#988ADB>  🌎 play.widcore.com | ⛏ Version: 1.16 - 1.21</gradient>"


# Do not touch
version: 1