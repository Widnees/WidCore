# ===============================
# TELEPORTATION SETTINGS
# ===============================

# Animation type: 'standart' or 'gta_style'
# standart: Simple teleport with particle effects
# gta_style: Cinematic camera animation
teleport-animation: 'standart'

# ===============================
# DEFAULT WORLD (AUTO RTP)
# ===============================
# What happens when /rtp command is used without arguments
default-world:
  enabled: true
  world: "world"
  # true: teleports directly to "world"
  # false: shows usage message
  
  # Towny integration settings for default world
  towny:
    # If enabled, RTP will avoid teleporting players into Towny claims.
    # Requires Towny/TownyAdvanced to be present.
    respect-claims: true

# ===============================
# WORLD SPECIFIC SETTINGS
# ===============================
# You can set different limits for specific worlds
# If world is not listed here, global settings above are used
worlds:
  world_nether:
    min-y: 30
    max-y: 120
    min-x: -5000
    max-x: 5000
    min-z: -5000
    max-z: 5000

# ===============================
# COOLDOWN
# ===============================

# Default cooldown in seconds (0 to disable)
# Permission-based cooldown: widcore.rtp.cooldown.<seconds>
# Example: widcore.rtp.cooldown.30 = 30 second cooldown
# Bypass permission: widcore.rtp.cooldown.bypass
cooldown:
  default: 60

# If true, whenever an RTP attempt fails/cancels (e.g., no safe position
# or claim protection), the plugin will automatically retry until success.
retry: true

# ===============================
# COST
# ===============================

# RTP cost settings (requires Vault)
# Set to 0 to disable cost
# Players with "widcore.rtp.free" permission bypass cost
cost:
  amount: 0

# ===============================
# BLOCKED BLOCKS
# ===============================

# Player will NOT spawn on or above these blocks
# Supports all Minecraft block names
blocked-blocks:
  - LAVA
  - WATER
  - CACTUS
  - MAGMA_BLOCK
  - FIRE
  - CAMPFIRE
  - SOUL_FIRE
  - SOUL_CAMPFIRE
  - SWEET_BERRY_BUSH
  - POWDER_SNOW
  - WITHER_ROSE
  - POINTED_DRIPSTONE

# ===============================
# MOVEMENT FREEZE
# ===============================

# If enabled, player's walk speed will be set to 0 while searching
# This prevents movement during the search process
freeze-on-teleport: false

# If enabled, player will be invisible during the entire RTP process
# They become visible again after teleportation completes
invisibility-during-rtp: true

# ===============================
# QUEUE SYSTEM
# ===============================

# If enabled, RTP requests will be queued
# Players will wait their turn if max-concurrent is reached
# If disabled, all RTP requests are processed immediately
queue:
  enabled: true
  # Maximum number of players that can RTP at the same time
  # Other players will wait in queue
  max-concurrent: 3

# ===============================
# LOCATION CACHE
# ===============================

# Teleport locations are saved
# When cache limit is reached, new RTP requests use previously saved locations
# This allows teleporting to the same locations and improves performance
cache:
  enabled: false
  # How many locations to save per world
  # When limit is reached, no new locations are searched, existing cached locations are used
  max-locations: 10

# ===============================
# PERFORMANCE (TPS THROTTLING)
# ===============================

# If enabled, RTP operations slow down when server TPS is low
# Operations run fast when TPS is good
# Slows down to protect the server when TPS is low
performance:
  enabled: true
  # If server TPS drops below this value, RTP search will slow down
  min-tps: 18.0

# ===============================
# TELEPORTATION EFFECTS
# ===============================

effects:
  # Show particle effects during teleportation
  show-particles: true
  
  # Radius of the ring that appears when teleportation completes
  teleport-particle:
    radius: 2.0

# Do not touch
version: 3
