name: WidCore
version: '2.6.4'
main: org.widnees.widCore.Main
api-version: '1.16'
load: STARTUP
authors: [ Widnees ]
description: Widnees Core Plugin
folia-supported: true
softdepend: [ProtocolLib, LuckPerms, PlaceholderAPI, Vault, Towny, TownyAdvanced, packetevents]

commands:
  widcore:
    description: WidCore ana komutu.
    usage: /<command> <reload|help|sayfa>
    aliases: [wc]
  widcore-show-item-internal:
    description: Dahili kullanım içindir.

permissions:
  widcore.*:
    description: Tüm WidCore yetkilerini verir.
    default: op
    children:
      widcore.player.*: true
      widcore.admin.*: true
      widcore.world.*: true
      widcore.chat.*: true
      widcore.economy.*: true
      widcore.server.*: true

  widcore.player.*:
    description: Tüm oyuncu yetkilerini verir.
    default: op
    children:
      widcore.fly: true
      widcore.fly.other: true
      widcore.god: true
      widcore.god.other: true
      widcore.heal: true
      widcore.heal.other: true
      widcore.feed: true
      widcore.feed.other: true
      widcore.speed: true
      widcore.speed.other: true
      widcore.back: true
      widcore.repair: true
      widcore.repair.all: true
      widcore.i: true
      widcore.inv: true
      widcore.ec: true
      widcore.ec.other: true
      widcore.head: true
      widcore.gamemode.*: true
      widcore.home.*: true
      widcore.tp.*: true
      widcore.tpa.*: true

  widcore.fly:
    description: Uçuş modunu açıp kapatma izni.
    default: op
  widcore.fly.other:
    description: Başka oyuncuların uçuş modunu değiştirme izni.
    default: op

  widcore.god:
    description: God modunu açıp kapatma izni.
    default: op
  widcore.god.other:
    description: Başka oyuncuların god modunu değiştirme izni.
    default: op

  widcore.heal:
    description: Kendini iyileştirme izni.
    default: op
  widcore.heal.other:
    description: Başka oyuncuları iyileştirme izni.
    default: op

  widcore.feed:
    description: Kendini doyurma izni.
    default: op
  widcore.feed.other:
    description: Başka oyuncuları doyurma izni.
    default: op

  widcore.speed:
    description: Hız ayarlama izni.
    default: op
  widcore.speed.other:
    description: Başka oyuncuların hızını ayarlama izni.
    default: op

  widcore.back:
    description: Son konuma geri dönme izni.
    default: op

  widcore.repair:
    description: Eldeki eşyayı tamir etme izni.
    default: op
  widcore.repair.all:
    description: Tüm eşyaları tamir etme izni.
    default: op

  widcore.i:
    description: Item verme komutu izni.
    default: op

  widcore.inv:
    description: Başka oyuncunun envanterini görme izni.
    default: op

  widcore.ec:
    description: Kendi ender sandığını açma izni.
    default: op
  widcore.ec.other:
    description: Başka oyuncuların ender sandığını açma izni.
    default: op

  widcore.head:
    description: Oyuncu kafası alma izni.
    default: op

  widcore.gamemode.*:
    description: Tüm oyun modu yetkilerini verir.
    default: op
