plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
    id "xyz.jpenilla.run-paper" version "2.3.1"
}

group = 'org.widnees'
version = '2.6.5'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://oss.sonatype.org/content/groups/public/" }
    maven { url = "https://repo.dmulloy2.net/repository/public/" }
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT"
    compileOnly 'net.kyori:adventure-api:4.17.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'io.netty:netty-all:4.1.97.Final'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'com.github.retrooper.packetevents:api:2.3.0' // packetevents
    compileOnly 'com.palmergames.bukkit.towny:towny:0.100.2.0' // towny
    // Use previously compiled classes (bin/main) to satisfy missing source packages during shadow build
    compileOnly files('bin/main')
}

shadowJar {
    relocate 'org.bstats', 'org.widnees.widCore.bstats'
    // Also include precompiled classes from bin/main so they are bundled into the fat jar
    from('bin/main') {
        // Ensure newly compiled ItemEffectManager overrides the legacy one from bin/main
        exclude 'org/widnees/widCore/manager/ItemEffectManager.class'
        exclude 'org/widnees/widCore/manager/ItemEffectManager$*.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doLast {
        def dest = file('/home/widnees/Desktop/testserver/plugins')
        if (dest.exists()) {
            copy {
                from archiveFile
                into dest
            }
            println ">>> Plugin kopyalandı: ${dest}/${archiveFileName.get()}"
        } else {
            println ">>> Uyarı: testserver/plugins klasörü bulunamadı, kopyalama atlandı."
        }
    }
}

// Build a Shadow (fat) JAR without compiling sources, using the already-built classes under bin/main
// and the processed resources (plugin.yml, langs, modules, etc.). This avoids compile errors while
// still producing a runnable artifact. Usage: gradlew shadowBin
tasks.register('shadowBin', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Create fat jar from bin/main + resources without compiling source.'
    archiveBaseName.set('WidCore')
    archiveVersion.set(version)
    archiveClassifier.set('all')

    // Include patch-compiled classes first (override), then precompiled classes and processed resources
    from('build/patch-classes')
    from('bin/main')
    from('build/resources/main')

    // Shade runtime implementation deps (e.g., bStats, json-simple) into the jar
    configurations = [project.configurations.runtimeClasspath]

    // Keep relocation consistent with normal shadowJar
    relocate 'org.bstats', 'org.widnees.widCore.bstats'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Ensure resources are processed (plugin.yml expansion) before packaging
    dependsOn 'processResources', 'compilePatchJava'
}

// Compile only the patch sources (small subset) against Paper API and existing compiled classes under bin/main
tasks.register('compilePatchJava', JavaCompile) {
    group = 'build'
    description = 'Compile patch sources in src/patch/java only.'
    source = fileTree('src/patch/java') { include '**/*.java' }
    destinationDirectory = file('build/patch-classes')
    options.encoding = 'UTF-8'
    // Classpath includes normal compile classpath plus previously compiled classes from bin/main
    classpath = files(configurations.compileClasspath, 'bin/main')
    // Use the same toolchain/release as main
    def targetJavaVersion = 17
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        options.release.set(targetJavaVersion)
    }
}


task copyLibs(type: Copy) {
    from configurations.runtimeClasspath
    from configurations.compileClasspath
    include '**/*.jar'

    into 'libs'
}

tasks {
    runServer {
        minecraftVersion("1.18")
    }
}

def targetJavaVersion = 17

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

def destDir = file('libs')


processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// --- Utility task: Decompile ItemEffectManager.class with CFR (uses Gradle's Java toolchain) ---
// 1) Ensure libs/cfr-0.152.jar exists (download with: curl -L -o libs/cfr-0.152.jar \
//    https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar)
// 2) Run: ./gradlew decompileItemEffect
// Output will be written under src/decompiled/org/widnees/widCore/manager/ItemEffectManager.java
tasks.register('decompileItemEffect', JavaExec) {
    group = 'decompile'
    description = 'Decompile ItemEffectManager.class using CFR'
    // Gradle 8+: use property setter
    mainClass.set('org.benf.cfr.reader.Main')
    // Use the CFR jar placed in libs folder
    classpath = files('libs/cfr-0.152.jar')
    // Input .class and output directory
    args 'bin/main/org/widnees/widCore/manager/ItemEffectManager.class', '--outputdir', 'src/decompiled'
    // Ensure JavaExec uses the configured toolchain (JDK 17) even if 'java' is not on PATH
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(targetJavaVersion) }
    javaLauncher.set(launcher)
    doFirst {
        def inFile = file('bin/main/org/widnees/widCore/manager/ItemEffectManager.class')
        if (!inFile.exists()) {
            throw new GradleException("Input class not found: ${inFile}. Build or copy classes under bin/main first.")
        }
        mkdir('src/decompiled')
        logger.lifecycle("Decompiling ${inFile} to src/decompiled ...")
    }
}