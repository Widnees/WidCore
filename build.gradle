plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta13'
    id "xyz.jpenilla.run-paper" version "2.3.1"
}

group = 'org.widnees'
version = '2.6.7'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://oss.sonatype.org/content/groups/public/" }
    maven { url = "https://repo.dmulloy2.net/repository/public/" }
    maven { url = 'https://repo.extendedclip.com/releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://repo.glaremasters.me/repository/towny/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT"
    compileOnly 'net.kyori:adventure-api:4.17.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.17.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'io.netty:netty-all:4.1.97.Final'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'com.github.retrooper.packetevents:api:2.3.0'
    compileOnly 'com.palmergames.bukkit.towny:towny:0.100.2.0'
    // Closed-source precompiled classes (ProtocolLibHook, ErrorLogHandler, etc.)
    compileOnly files('libs/widcore-precompiled.jar')
}

shadowJar {
    relocate 'org.bstats', 'org.widnees.widCore.bstats'
    // Include closed-source precompiled classes into the fat jar
    from(zipTree('libs/widcore-precompiled.jar'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doLast {
        def dest = file('/home/widnees/Desktop/testserver/plugins')
        if (dest.exists()) {
            copy {
                from archiveFile
                into dest
            }
            println ">>> Plugin kopyalandı: ${dest}/${archiveFileName.get()}"
        } else {
            println ">>> Uyarı: testserver/plugins klasörü bulunamadı, kopyalama atlandı."
        }
    }
}

tasks {
    runServer {
        minecraftVersion("1.18")
    }
}

def targetJavaVersion = 17

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}