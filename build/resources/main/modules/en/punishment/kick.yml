# Kick broadcast message to server
broadcast-message: "&c{target} &7was kicked by &c{player}&7. &8(&f{reason}&8)"

# Message shown on kicked player's screen
kick-screen-message:
  - "&c&lYOU HAVE BEEN KICKED"
  - ""
  - "&7Reason: &f{reason}"
  - ""
  - "&7You can rejoin the server."

# These players cannot be kicked
exempt-players:
  - "Notch"


# Do not touch
version: 1