# Yasaklı kelimeler listesi
blacklist:
  - "kufur1"
  - "kufur2"
  - "kotukelime"

# İzin verilen kelimeler (Blacklist içinde geçse bile engellenmez)
whitelist:
  - "hosgeldin"
  - "merhaba"

# Sembol/Karakter değiştirme haritası (örn: @ -> a)
# Oyuncuların filtreyi aşmak için kullandığı karakterleri buraya ekleyin.
symbol-replacement:
  "@": "a"
  "1": "i"
  "$": "s"
  "0": "o"


# Dokunma
version: 1