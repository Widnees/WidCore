# ====================================
# İLK KATILIM AYARLARI
# ====================================
first-join:
  enabled: true
  
  # --- MESAJLAR ---
  messages:
    # Herkese gönderilecek mesajlar
    all-players:
      chat: "&8[&6⭐&8] &e%player% &7ilk kez sunucuya katıldı!"
      title: ""
      subtitle: ""
      actionbar: "&e%player% &7ilk kez aramıza katıldı!"
    
    # Sadece ilk kez giren oyuncuya gönderilecek mesajlar
    only-player:
      chat: "&aServera hoş geldin &e%player%&a! İlk katılımın!"
      title: "&6Hoş Geldin!"
      subtitle: "&7İlk katılımın"
      actionbar: "&eİlk kez sunucumuza katıldın!"
  
  # --- SÜRE AYARLARI ---
  # Title/Subtitle ekranda kalma süresi (milisaniye cinsinden)
  title-duration: 3500
  
  # ActionBar ekranda kalma süresi (milisaniye cinsinden)
  actionbar-duration: 3000
  
  # --- KARŞILAMA MENÜSÜ ---
  # İlk katılımda gösterilecek özel menü
  welcome-menu:
    enabled: true
    size: 27  # Menü boyutu: 9, 18, 27, 36, 45, 54
    
    # Menü başlığı
    title: "§6İlk Katılım Menüsü"
    
    # Menü itemleri (slot numarasına göre)
    items:
      # Basit cam panel
      "0":
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
        lore: []
  
  # --- SES AYARLARI ---
  sound:
    all-players: "UI_TOAST_CHALLENGE_COMPLETE"
    only-player: "ENTITY_PLAYER_LEVELUP"


# ====================================
# OYUNCU GİRİŞ AYARLARI
# ====================================
join:
  enabled: true
  
  # --- MESAJLAR ---
  messages:
    # Herkese gönderilecek mesajlar
    all-players:
      chat: "&8[&a+&8] &7%player%"
      title: ""
      subtitle: ""
      actionbar: "&a%player% &7servera katıldı!"
    
    # Sadece giren oyuncuya gönderilecek mesajlar
    only-player:
      chat: "&aHoş geldin &e%player%&a!"
      title: "&aHoş Geldin"
      subtitle: "&7%server%"
      actionbar: "&aServera başarıyla katıldın!"
  
  # --- SÜRE AYARLARI ---
  # Title/Subtitle ekranda kalma süresi (milisaniye cinsinden)
  title-duration: 3500
  
  # ActionBar ekranda kalma süresi (milisaniye cinsinden)
  actionbar-duration: 3000
  
  # --- KARŞILAMA MENÜSÜ ---
  # Oyuncu giriş yaptığında gösterilecek menü
  welcome-menu:
    enabled: false  # true yaparak menüyü aktif edin
    size: 27  # Menü boyutu: 9, 18, 27, 36, 45, 54
    
    # Menü başlığı
    # Özel fontlar için:
    #   - ItemsAdder: %img_icon_name% veya char
    #   - Nexo: %nexo_icon_name% veya char
    title: "§8Hoş Geldin Menüsü"
    
    # Menü itemleri (slot numarasına göre)
    items:
      # Basit cam panel
      "0":
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
        lore: []
      
      # ItemsAdder item örneği (yorum satırı):
      # "13":
      #   material: "itemsadder:namespace:item_id"
      #   name: "&aÖzel Item"
      #   lore:
      #     - "&7Bu bir ItemsAdder item"
      #     - "&7Menü sadece gösterim içindir"
      
      # Nexo item örneği (yorum satırı):
      # "22":
      #   material: "nexo:item_id"
      #   name: "&cNexo Item"
      #   lore:
      #     - "&7Bu bir Nexo item"
      #     - ""
      #     - "&eMenuyü kapatmak için ESC'ye bas"
  
  # --- SES AYARLARI ---
  # Vanilla sesler ve ItemsAdder/Oraxen/Nexo custom sesleri desteklenir
  # Örnek custom ses: join:custom_join_sound
  # ItemsAdder/Nexo desteği:
  #   - Emoji: :emoji_name:
  #   - ItemsAdder tag: %img_item_name%
  #   - Nexo tag: %nexo_item_name%
  sound:
    all-players: "ENTITY_EXPERIENCE_ORB_PICKUP"
    only-player: "BLOCK_NOTE_BLOCK_PLING"


# ====================================
# OYUNCU ÇIKIŞ AYARLARI
# ====================================
quit:
  enabled: true
  
  # --- MESAJLAR ---
  messages:
    # Herkese gönderilecek mesajlar
    all-players:
      chat: "&8[&c-&8] &7%player%"
      title: ""
      subtitle: ""
      actionbar: "&c%player% &7serverdan ayrıldı!"
    # Not: Çıkış yaparken oyuncuya mesaj gönderilemez
  
  # --- SÜRE AYARLARI ---
  # Title/Subtitle ekranda kalma süresi (milisaniye cinsinden)
  title-duration: 3500
  
  # ActionBar ekranda kalma süresi (milisaniye cinsinden)
  actionbar-duration: 3000
  
  # --- SES AYARLARI ---
  # Vanilla sesler ve ItemsAdder/Oraxen/Nexo custom sesleri desteklenir
  # Örnek custom ses: quit:custom_quit_sound
  # ItemsAdder/Nexo desteği:
  #   - Emoji: :emoji_name:
  #   - ItemsAdder tag: %img_item_name%
  #   - Nexo tag: %nexo_item_name%
  sound:
    all-players: "UI_BUTTON_CLICK"

# Vanish modundaki oyuncular için sahte çıkış/giriş mesajı gönder
fake-messages-on-vanish: true


# Dokunma
version: 4
