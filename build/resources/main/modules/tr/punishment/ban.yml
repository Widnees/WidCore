# Sunucuya duyurulacak yasaklama mesajı
broadcast-message: "&c{target} &7adlı oyuncu &c{player} &7tarafından yasaklandı. &8(&f{reason}&8)"

# Yasaklanan oyuncunun ekranında görünecek mesaj
kick-screen-message:
  - "&c&lSUNUCUDAN YASAKLANDINIZ"
  - ""
  - "&7Sebep: &f{reason}"
  - "&7Süre: &f{duration}"
  - ""
  - "&7İtiraz için Discord'a gelebilirsiniz."

# Bu oyuncular yasaklanamaz
exempt-players:
  - "Notch"

# Komutlarda hazır sebep kısayollarını kullan (örn: /tempban oyuncu hile)
use-reason-shortcuts: true

# Sadece kayıtlı kısayolların kullanılmasını zorunlu kıl
force-reason-shortcuts: false

# Hazır sebepler ve süreleri (s: saniye, m: dakika, h: saat, d: gün)
reasons:
  hile: "30d"
  kufur: "1d"
  reklam: "7d"


# Dokunma
version: 1