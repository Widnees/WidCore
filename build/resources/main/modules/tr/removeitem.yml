# Oyuncu öldüğünde düşen eşyaları silmeyi etkinleştir
enable-player-death-removal: true
# Yere atılan normal eşyaları silmeyi etkinleştir
enable-default-removal: true

# Ölümden düşen eşyaların silinme süresi (saniye)
player-death-lifespan-seconds: 300
# Normal eşyaların silinme süresi (saniye)
default-lifespan-seconds: 60

# Eşyaların üzerindeki hologram formatı
hologram-format: "&c{time}sn"
hologram-visible-distance: 10


# Dokunma
version: 1