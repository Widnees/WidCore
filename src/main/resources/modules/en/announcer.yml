# Announcer system settings
settings:
  # How often should announcements be shown (in seconds)?
  interval: 60

  # Should announcements be selected randomly?
  # true: Random announcement selection.
  # false: Sequential order (1, 2, 3...).
  random-order: false

  # Sound to play when announcement is shown.
  # Leave empty for no sound: ""
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

# --- CLICKABLE WORDS (REPLACEMENTS) ---
# Use %key% in announcement texts to apply
# the settings below.
replacements:
  # Usage: %discord%
  discord:
    input: "&9&lDISCORD"           # Text shown in chat
    output: "https://discord.com/" # Link to open when clicked
    hover: "&7Click to join our Discord server!" # (Optional) Hover text

  # Usage: %site%
  site:
    input: "&b&lOUR WEBSITE"
    output: "https://www.google.com"
    hover: "&fVisit our website!"

# --- GLOBAL ANNOUNCEMENTS ---
# These announcements are shown in all worlds that are NOT
# defined in the 'worlds' section below.
global:
  '1':
    text:
      - "&8&m---------------------------------"
      - " &6&lAnnouncement &8» &fWelcome to our server, &e%player_name%&f!"
      - " &fJoin our Discord: %discord%"
      - "&8&m---------------------------------"
  '2':
    text:
      - "&aVisit %site% to purchase VIP!"

# --- WORLD-SPECIFIC ANNOUNCEMENTS ---
# Worlds added here will ONLY show their own announcements.
# Global announcements will NOT appear in these worlds.
worlds:
  # Custom messages for Nether world
  world_nether:
    '1':
      text:
        - "&c&lWarning! &eYou're in the Nether, watch out for lava!"
    '2':
      text:
        - "&6PvP is enabled in the Nether!"

  # Custom messages for End world
  world_the_end:
    '1':
      text:
        - "&bDragon event coming soon in the End!"

# Do not touch
version: 2