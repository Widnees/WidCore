# Allowed domain names (whitelist)
whitelist-domains:
  - "ourwebsite.com"
  - "youtube.com"
  - "discord.gg"

# Domain extensions to block
blacklist-extensions:
  - "com"
  - "net"
  - "org"
  - "xyz"
  - "gg"

# Block IP address sharing (numeric)
block-ip-addresses: true

# Verify IPv4 with ping (`true` will attempt to ping the potential IP address to see if it's active. It will only block the chat if the IP operates as a real server, preventing false positives from random numbers).
verify-ip-with-ping: true

# Discord invite link control
discord:
  block-invites: true
  # Determines whether short discord invite codes (abbreviations) like /naber should be blocked.
  block-shorts: false
  # Only allow these server IDs/codes
  whitelist-servers:
    - "your_dc_code"


# Do not touch
version: 2