# Home System Configuration

# Default maximum number of homes (used when no permission applies)
# NOTE: Even OP is subject to this limit; it can only be raised via permission
default-max-homes: 3

# Teleportation animation type (standart / gta_style)
teleport-animation: 'gta_style'

# During GTA style animation, blindness effect is applied if you are
# further than this distance (blocks) from the target location.
gta-style-blindness-distance: 100.0

# Animation speed multiplier for GTA style. 1.0 = normal, 1.5 = 50% faster, 2.0 = double speed
gta-style-animation-speed: 1.0

# Teleportation delay time (seconds)
teleport-delay-seconds: 3

# Cancel teleportation when moving?
cancel-on-move: true

# Cancel teleportation when taking or dealing damage?
cancel-on-damage: true

# Cancel teleportation when breaking or placing a block?
cancel-on-block-break: true

# Teleportation effect settings
effects:
  # Show particle effects
  show-particles: true

  # Radius of the ring that appears when teleportation completes
  teleport-particle:
    radius: 2.0

# Banned worlds - Players cannot set homes in these worlds
banned-worlds:
  - "world_nether"
  - "world_the_end"

# Menu settings
menu:
  # Show home location (world, x, y, z) in the home menu
  show-location: true

# ===============================
# NOTIFICATION SETTINGS
# ===============================
# Leave fields empty to disable that notification.
# Toast frame types: TASK (yellow), GOAL (green), CHALLENGE (purple)
# Available placeholders: %home%, %time%

notifications:
  # When warmup countdown starts
  warmup:
    chat: "&aYou will be teleported to home '%home%' in %time% seconds."
    title:
      title: ""
      subtitle: ""
      fade-in: 10
      stay: 40
      fade-out: 10
    actionbar: ""
    toast:
      item: RED_BED
      frame: TASK
      title: ""

  # When teleportation completes successfully
  success:
    chat: "&aSuccessfully teleported to home '%home%'."
    title:
      title: "&a&lTeleported!"
      subtitle: "&7%home%"
      fade-in: 10
      stay: 50
      fade-out: 20
    actionbar: ""
    toast:
      item: RED_BED
      frame: GOAL
      title: "&aArrived at &7%home%"


# Do not touch
version: 5