# Enable removal of items dropped on player death
enable-player-death-removal: true
# Enable removal of normal dropped items
enable-default-removal: true

# Time until death-dropped items are removed (seconds)
player-death-lifespan-seconds: 300
# Time until normal items are removed (seconds)
default-lifespan-seconds: 60

# Hologram format displayed above items
hologram-format: "&c{time}s"
hologram-visible-distance: 10


# Do not touch
version: 1