# Available placeholders: %target%, %player%, %reason%
messages:
  # Broadcast message to server
  broadcast: "&c%target% &7was kicked by &c%player%&7. &8(&f%reason%&8)"

  # Message shown on kicked player's screen
  kick-screen:
    - "&c&lYOU HAVE BEEN KICKED"
    - ""
    - "&7Reason: &f%reason%"
    - ""
    - "&7You can reconnect."

  # /kickall success message - %count%, %reason%
  kickall-success: "&e%count% &aplayers kicked from the server. Reason: &f%reason%"

  # /kickip success message - %ip%, %count%, %reason%
  kickip-success: "&aKicked &e%count% &aplayer(s) with IP &e%ip%&a. Reason: &f%reason%"

# These players cannot be kicked
exempt-players:
  - "Notch"

# Discord webhook notification - Kick
kick-webhook:
  enabled: false
  url: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  author: "WidCore Punishment System"
  title: "👢 Player Kicked"
  color: 16776960
  fields:
    - name: "👤 Player"
      value: "%target%"
      inline: true
    - name: "👮 Staff"
      value: "%player%"
      inline: true
    - name: "📋 Reason"
      value: "%reason%"
      inline: false

# Do not touch
version: 5