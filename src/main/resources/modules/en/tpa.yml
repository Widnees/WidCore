# TPA Module Configuration

# Animation type: 'standart', 'gta_style' or 'fog'
teleport-animation: "standart"

# Blindness distance for GTA style animation
gta-style-blindness-distance: 100.0

# Request timeout (seconds)
request-timeout: 60
# Cooldown before sending another request (seconds)
cooldown: 30

# Teleportation warmup settings
teleport-warmup:
  enabled: true
  duration: 3
  cancel-on-move: true

# Cancel teleportation if player deals damage to an entity?
cancel-on-damage-deal: true

# Cancel teleportation if player breaks a block?
cancel-on-block-break: true

# Damage immunity duration after teleporting (seconds)
teleport-protection:
  enabled: true
  duration: 5

# Teleportation effect particle width
effects:
  # Show particle effects
  show-particles: true

  teleport-particle:
    radius: 4.0

# Do not touch
version: 5