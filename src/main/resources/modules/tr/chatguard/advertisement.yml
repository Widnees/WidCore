# İzin verilen alan adları (whitelist)
whitelist-domains:
  - "kendisitemiz.com"
  - "youtube.com"
  - "discord.gg"

# Engellenecek alan adı uzantıları
blacklist-extensions:
  - "com"
  - "net"
  - "org"
  - "xyz"
  - "gg"

# IP adresi paylaşımını (sayısal) engelle
block-ip-addresses: true

# IPv4 doğrulaması yap (`true` yaparsanız mesajdaki muhtemel IP adreslerine ping atılarak aktif olup olmadıkları test edilir. Sadece aktif olan (gerçek) IP'ler engellenir, geçersiz numaralar false-positive oluşturmaz).
verify-ip-with-ping: true

# Discord davet bağlantısı kontrolü
discord:
  block-invites: true
  # /naber gibi kısa discord davet kodlarının (kısaltmaların) engellenip engellenmeyeceğini belirler.
  block-shorts: false
  # Sadece bu sunucu ID'lerine/kodlarına izin ver
  whitelist-servers:
    - "kendi_dc_kodun"


# Dokunma
version: 2