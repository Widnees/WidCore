# TPA Modülü Ayarları

# Işınlanma animasyonu türü: 'standart', 'gta_style' veya 'fog'
teleport-animation: "standart"

# GTA stili animasyonda körlük mesafesi
gta-style-blindness-distance: 100.0

# GTA style animasyon hız çarpanı. 1.0 = normal, 1.5 = %50 daha hızlı, 2.0 = iki kat hız
gta-style-animation-speed: 1.0

# İstek zaman aşımı (saniye)
request-timeout: 60
# Tekrar istek gönderme bekleme süresi (saniye)
cooldown: 30

# Işınlanma öncesi bekleme ayarları
teleport-warmup:
  enabled: true
  duration: 3
  cancel-on-move: true

# Oyuncu ışınlanma sırasında bir varlığa hasar verirse işlem iptal edilsin mi?
cancel-on-damage-deal: true

# Oyuncu ışınlanma sırasında blok kırarsa işlem iptal edilsin mi?
cancel-on-block-break: true

# Işınlanma sonrası koruma süresi (saniye)
teleport-protection:
  enabled: true
  duration: 5

# Işınlanma partikül genişliği (eğer standart kullanılıyorsa)
effects:
  # Partikül efektlerini göster
  show-particles: true

  teleport-particle:
    radius: 4.0

# ===============================
# BİLDİRİM AYARLARI
# ===============================
# Boş bırakılan alanlar gönderilmez.
# Toast çerçeve türleri: TASK (sarı), GOAL (yeşil), CHALLENGE (mor)
# Kullanılabilir placeholder'lar: %time%, %player%

notifications:
  # Bekleme süresi başladığında (warmup)
  warmup:
    chat: "&aIşınlanma başlıyor... &e%time% &asn."
    title:
      title: "&aIşınlanma"
      subtitle: "&e%time% &fsaniye..."
      fade-in: 0
      stay: 25
      fade-out: 5
    actionbar: ""
    toast:
      item: ENDER_PEARL
      frame: TASK
      title: ""

  # Işınlanma başarıyla tamamlandığında
  success:
    chat: "&aIşınlanma tamamlandı."
    title:
      title: "&a&lIşınlandınız!"
      subtitle: ""
      fade-in: 10
      stay: 50
      fade-out: 20
    actionbar: ""
    toast:
      item: ENDER_PEARL
      frame: GOAL
      title: "&aIşınlanma tamamlandı"


# Dokunma
version: 5