# Işınlanma animasyonu türü (standart / gta_style / fog)
teleport-animation: 'gta_style'

# GTA stili animasyon sırasında, hedef noktaya bu mesafeden (blok)
# daha uzaktaysanız körlük efekti uygulanır.
gta-style-blindness-distance: 100.0

# GTA style animasyon hız çarpanı. 1.0 = normal, 1.5 = %50 daha hızlı, 2.0 = iki kat hız
gta-style-animation-speed: 1.0

# Işınlanma bekleme süresi (saniye)
teleport-delay-seconds: 3

# Hareket edince ışınlanma iptal edilsin mi?
cancel-on-move: true

# Hasar alınca veya verince ışınlanma iptal edilsin mi?
cancel-on-damage: true

# Işınlanma efekt ayarları
effects:
  # Partikül efektlerini göster
  show-particles: true

  # Işınlanma tamamlandığında oluşacak halkanın yarıçapı
  teleport-particle:
    radius: 2.0

# ===============================
# BİLDİRİM AYARLARI
# ===============================
# Boş bırakılan alanlar gönderilmez.
# Toast çerçeve türleri: TASK (sarı), GOAL (yeşil), CHALLENGE (mor)
# Kullanılabilir placeholder'lar: %warp%, %time%

notifications:
  # Bekleme süresi başladığında
  warmup:
    chat: "&a%time% saniye içinde '%warp%' noktasına ışınlanacaksınız."
    title:
      title: ""
      subtitle: ""
      fade-in: 10
      stay: 40
      fade-out: 10
    actionbar: ""
    toast:
      item: ENDER_PEARL
      frame: TASK
      title: ""

  # Işınlanma başarıyla tamamlandığında
  success:
    chat: "&aBaşarıyla '%warp%' noktasına ışınlandınız."
    title:
      title: "&a&lIşınlandınız!"
      subtitle: "&7%warp%"
      fade-in: 10
      stay: 50
      fade-out: 20
    actionbar: ""
    toast:
      item: ENDER_PEARL
      frame: GOAL
      title: "&a%warp% &7noktasına ulaştınız"


# Dokunma
version: 2